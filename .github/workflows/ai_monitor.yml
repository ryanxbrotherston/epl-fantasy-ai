name: AI Team Monitor

# Runs independently of the Streamlit site (Streamlit Cloud can't run
# background jobs on its own - this is what makes the "continuous checking"
# part actually work). Adjust the schedule below as GW deadlines approach;
# every hour is a reasonable default, tighten to every 15-30 min in the
# final day before a deadline if you want faster alerts.
on:
  schedule:
    - cron: "0 * * * *"   # every hour, on the hour (UTC)
  workflow_dispatch: {}     # lets you trigger a manual run from the Actions tab

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run monitor
        env:
          AI_TEAM_ID: ${{ secrets.AI_TEAM_ID }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
          ALERT_EMAIL_APP_PASSWORD: ${{ secrets.ALERT_EMAIL_APP_PASSWORD }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          HIGHLIGHTLY_API_KEY: ${{ secrets.HIGHLIGHTLY_API_KEY }}
        run: python src/ai_team_monitor.py

      - name: Commit updated logs (if changed)
        run: |
          git config user.name "ai-team-monitor"
          git config user.email "actions@github.com"
          # alert_log.json: injury/suspension/bench-likely alert dedup.
          # lineup_prediction_snapshots.json + lineup_prediction_accuracy.json:
          # lineup_prediction_log.py's ongoing "log accuracy going forward"
          # track record for the early-prediction signal - these need
          # committing back too, same reason as alert_log.json (GitHub
          # Actions runners are fresh containers every run, nothing persists
          # otherwise).
          for f in data/alert_log.json data/lineup_prediction_snapshots.json data/lineup_prediction_accuracy.json; do
            [ -f "$f" ] && git add "$f"
          done
          git diff --staged --quiet || git commit -m "Update monitor logs [skip ci]"
          git push || true
